<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannett Building</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        
        /* 3D Viewer Base */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }

        /* Loading Screen Elements */
        #loading-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #222;
            z-index: 5;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #loading-overlay.hidden {
            opacity: 0;
        }

        #spinner {
            position: absolute;
            top: calc(50% + 140px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #spinner.hidden {
            opacity: 0;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Title & Logo Container */
        #title-container {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 10px; 
            pointer-events: none;
            z-index: 10;
            transition: all 1.5s ease-in-out; 
        }

        #title-container.zoomed {
            top: 5%; 
            transform: translate(-50%, 0) scale(0.75); 
        }

        #building-title {
            margin: 0;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

        #building-logo {
            height: 120px; 
            width: auto;
            opacity: 1; 
            mix-blend-mode: screen; 
        }

        /* Custom Interaction Prompt */
        #custom-prompt {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            color: #ffffff;
            padding: 12px 32px; 
            border-radius: 50px; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem; 
            font-weight: 400;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 0.8s ease;
            animation: pulse 2.5s infinite;
        }

        #custom-prompt.visible {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); } 
            100% { transform: translateX(-50%) scale(1); }
        }
    </style> 
</head>  

<body>

    <div id="loading-overlay"></div>
    <div id="spinner"></div>

    <div id="title-container">
        <img id="building-logo" src="Logot.png" alt="Gannett Logo">
        <h1 id="building-title">Gannett Building</h1>
    </div>

    <div id="custom-prompt">Drag to interact</div>
    
    <model-viewer 
        id="gannett-viewer"
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls  
        rotation-per-second="3deg"
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="520.2deg 74.59deg 700m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg 800m" 
        min-camera-orbit="auto auto 20.4m" 
        min-field-of-view="3deg"
        interpolation-decay="400"
        interaction-prompt="none"> 
    </model-viewer>

    <script>
        const viewer = document.getElementById('gannett-viewer');
        const titleContainer = document.getElementById('title-container');
        const overlay = document.getElementById('loading-overlay');
        const spinner = document.getElementById('spinner');
        const customPrompt = document.getElementById('custom-prompt');

        // Animation sequence on load
        viewer.addEventListener('load', () => {
            // 1. Hide spinner immediately
            spinner.classList.add('hidden');

            // 2. Wait 800ms, then trigger fade overlay and slide text
            setTimeout(() => {
                overlay.classList.add('hidden'); 
                titleContainer.classList.add('zoomed'); 

                // 3. Delay the camera zoom slightly so the black overlay has time to start fading
                // The `interpolation-decay="400"` attribute ensures this takes a few seconds to complete
                setTimeout(() => {
                    viewer.setAttribute('camera-orbit', '580.2deg 74.59deg 350m'); 
                }, 50);

                // 4. Wait for the camera to mostly settle, then fade in the custom prompt
                // Wait for zoom to settle (e.g., 2000 milliseconds = 2 seconds)
                setTimeout(() => {
                customPrompt.classList.add('visible');
    
                    // This turns on the auto-rotation!
                    viewer.autoRotate = true; 
    
                    }, 3000); // Change this number to increase or decrease the delay

            }, 800);
        });

        // Hide custom prompt the moment the user interacts
        viewer.addEventListener('camera-change', (event) => {
            if (event.detail.source === 'user-interaction') {
                customPrompt.classList.remove('visible');
            }
        });
    </script>

</body>
</html>
