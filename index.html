<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannett Building</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        
        /* Model transition (starts transparent/hidden, fades to fully opaque) */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
            opacity: .05; /* Starts hidden */
            transition: opacity 1.5s ease-in-out;
        }
        
        /* When class 'loaded' is added, model becomes fully opaque */
        model-viewer.loaded {
            opacity: 1;
        }

        /* Center-to-Top Title & Logo Container */
        #title-container {
            position: absolute;
            top: 50%; /* Starts perfectly in the middle */
            left: 50%;
            transform: translate(-50%, -50%); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Adds space between the logo and the text */
            pointer-events: none;
            z-index: 10;
            transition: all 1.5s ease-in-out; /* Smoothly animates the move */
        }

        /* State when zoomed in */
        #title-container.zoomed {
            top: 5%; /* Moves to the top of the screen */
            transform: translate(-50%, 0);
        }

        /* Title styling */
        #building-title {
            margin: 0;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

        /* Logo styling */
        #building-logo {
            height: 50px; /* Change this number to make your logo bigger or smaller */
            width: auto;
            opacity: 0.95;
            filter: drop-shadow(0px 4px 15px rgba(0, 0, 0, 0.8)); /* Matches the text shadow */
        }
    </style>
</head>
<body>

    <div id="title-container">
        <img id="building-logo" src="Logo.png" alt="Gannett Logo">
        <h1 id="building-title">Gannett Building</h1>
    </div>

    <model-viewer 
        id="gannett-viewer"
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        rotation-per-second="3deg"
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="490.2deg 74.59deg 300m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg 500m" 
        min-camera-orbit="auto auto 25.4m" 
        min-field-of-view="4deg">
    </model-viewer>

    <script>
        const viewer = document.getElementById('gannett-viewer');
        const titleContainer = document.getElementById('title-container');

        // Wait for the 3D model to fully load
        viewer.addEventListener('load', () => {
            // Fade the model in (makes it fully opaque)
            viewer.classList.add('loaded');

            // Wait a split second, then trigger the zoom and slide the title to the top
            setTimeout(() => {
                // Ensure the zoom-in angle (490.2deg) matches your new starting angle so it zooms straight in
                viewer.setAttribute('camera-orbit', '420.2deg 74.59deg 340.4m');
                titleContainer.classList.add('zoomed');
            }, 800);
        });
    </script>

</body>
</html>
