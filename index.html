<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannett Building</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        
        /* 3D Viewer Base */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }

        /* Loading Screen Elements */
        #loading-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #222;
            z-index: 5;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #loading-overlay.hidden {
            opacity: 0;
        }

        #spinner {
            position: absolute;
            top: calc(50% + 140px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #spinner.hidden {
            opacity: 0;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Title & Logo Container */
        #title-container {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        #building-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Translates it perfectly above the center point */
            transform: translate(-50%, -100%);
            margin-top: -5px; /* Creates a 10px gap between logo and title */
            height: 120px; 
            width: auto;
            opacity: 1; 
            mix-blend-mode: screen; 
            transition: all 1.5s ease-in-out; 
        }

        #building-title {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Translates it perfectly below the center point */
            transform: translate(-50%, 0);
            margin-top: 5px; /* Creates a 10px gap between logo and title */
            margin: 0;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
            transition: all 1.5s ease-in-out;
            white-space: nowrap; /* Prevents text from breaking onto two lines during animation */
        }

        /* End States when .zoomed is applied to the container */
        #title-container.zoomed #building-logo {
            top: 4%; 
            left: 95%; /* Pushes to the right edge */
            transform: translate(-100%, 0) scale(0.70);
            margin-top: 0;
        }

        #title-container.zoomed #building-title {
            top: 5%; 
            left: 50%; /* Keeps it centered */
            transform: translate(-50%, 0) scale(0.75); 
            margin-top: 0;
        }

        /* Custom Interaction Prompt */
        #custom-prompt {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            color: #ffffff;
            padding: 12px 32px; 
            border-radius: 50px; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem; 
            font-weight: 400;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 0.8s ease;
            animation: pulse 2.5s infinite;
        }

        #custom-prompt.visible {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); } 
            100% { transform: translateX(-50%) scale(1); }
        }
    </style> 
</head>  

<body>

    <div id="loading-overlay"></div>
    <div id="spinner"></div>

    <div id="title-container">
        <img id="building-logo" src="LogoF.png" alt="Gannett Logo">
        <h1 id="building-title">Gannett Building</h1>
    </div>

    <div id="custom-prompt">Drag to interact</div>
    
    <model-viewer 
        id="gannett-viewer"
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls  
        rotation-per-second="3deg"
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="520.2deg 74.59deg 675m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg 700m" 
        min-camera-orbit="auto auto 100.4m" 
        min-field-of-view="4deg"
        interpolation-decay="575"
        interaction-prompt="none"> 
    </model-viewer>

    <script>
        const viewer = document.getElementById('gannett-viewer');
        const titleContainer = document.getElementById('title-container');
        const overlay = document.getElementById('loading-overlay');
        const spinner = document.getElementById('spinner');
        const customPrompt = document.getElementById('custom-prompt');

        // Animation sequence on load
        viewer.addEventListener('load', () => {
            // 1. Hide spinner immediately
            spinner.classList.add('hidden');

            // 2. Wait 800ms, then trigger fade overlay and slide text
            setTimeout(() => {
                overlay.classList.add('hidden'); 
                titleContainer.classList.add('zoomed'); 

                // 3. Delay the camera zoom slightly so the black overlay has time to start fading
                setTimeout(() => {
                    // Pushed zoom in closer to 180m
                    viewer.setAttribute('camera-orbit', '582.2deg 74.59deg 260m'); 
                }, 350);

                // 4. Wait for the camera to mostly settle, then fade in the custom prompt
                setTimeout(() => {
                    customPrompt.classList.add('visible');
                    
                    // This turns on the auto-rotation!
                    viewer.autoRotate = true; 
                    
                    // RESTORE DRAG SPEED: Switch decay to 100 so mouse interaction is fast and responsive
                    viewer.setAttribute('interpolation-decay', '175'); 
                    
                }, 3200); // Trigger this when the zoom is roughly finishing

            }, 800);
        });

        // Hide custom prompt the moment the user interacts
        viewer.addEventListener('camera-change', (event) => {
            if (event.detail.source === 'user-interaction') {
                customPrompt.classList.remove('visible');
            }
        });
    </script>

</body>
</html>
