<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Viewer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* This removes default white borders and makes the model fill the whole screen */
        body { margin: 0; padding: 0; background-color: #222; }
        model-viewer { width: 100vw; height: 100vh; } 
    </style>
</head>
<body>

    <model-viewer 
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="670.2deg 74.59deg 340.4m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg auto" 
        min-camera-orbit="auto auto 340.4m" 
        min-field-of-view="12deg"
        skybox-image="https://modelviewer.dev/shared-assets/environments/whipple_creek_regional_park_1k_HDR.jpg"
        skybox-height="10m">
    </model-viewer>

</body>
</html>
