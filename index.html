<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannett Building</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        
        /* 3D Viewer Base */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }

        /* Loading Screen Elements */
        #loading-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #222;
            z-index: 5;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #loading-overlay.hidden {
            opacity: 0;
        }

        #spinner {
            position: absolute;
            top: calc(50% + 140px); /* Pushed further down to clear the stacked logo and text */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #spinner.hidden {
            opacity: 0;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Title & Logo Container */
        #title-container {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); 
            display: flex;
            flex-direction: column; /* Stacks the logo above the text */
            align-items: center;
            justify-content: center;
            gap: 10px; /* Reduced gap since they are stacked */
            pointer-events: none;
            z-index: 10;
            transition: all 1.5s ease-in-out; 
        }

        #title-container.zoomed {
            top: 5%; 
            /* Shrinks the stacked grouping slightly so it isn't overwhelming at the top */
            transform: translate(-50%, 0) scale(0.75); 
        }

        #building-title {
            margin: 0;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
        }

        #building-logo {
            height: 120px; /* Significantly increased for the loading screen */
            width: auto;
            opacity: 1; /* Bumped to 100% for better visibility */
            mix-blend-mode: screen; 
            /* Optional: If the logo is still too dark, uncomment the line below to brighten it */
            /* filter: brightness(1.5) drop-shadow(0px 4px 10px rgba(0,0,0,0.5)); */
        }

        /* Custom Interaction Prompt */
        #custom-prompt {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            
            /* Sleek Glassmorphism Styling */
            background-color: rgba(20, 20, 20, 0.4); /* Highly transparent dark background */
            backdrop-filter: blur(8px); /* Blurs the 3D model slightly behind the prompt */
            -webkit-backdrop-filter: blur(8px); /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.15); /* Subtle border for edge definition */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); /* Soft, wide shadow */
            
            color: #ffffff;
            padding: 12px 32px; /* Wider padding looks more modern */
            border-radius: 50px; /* Fully rounded pill shape */
            
            /* Typography adjustments */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem; /* Slightly smaller text */
            font-weight: 400;
            text-transform: uppercase; /* All caps adds to the sleek UI feel */
            letter-spacing: 2px; /* Wider spacing pairs well with uppercase */
            
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 0.8s ease;
            animation: pulse 2.5s infinite;
        }

        #custom-prompt.visible {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); } /* Reduced scale jump for a more subtle pulse */
            100% { transform: translateX(-50%) scale(1); }
        }
    </style> 
</head>  

<body>

    <div id="loading-overlay"></div>
    <div id="spinner"></div>

    <div id="title-container">
        <img id="building-logo" src="logo.png" alt="Gannett Logo">
        <h1 id="building-title">Gannett Building</h1>
    </div>

    <div id="custom-prompt">Drag to interact</div>
    
    <model-viewer 
        id="gannett-viewer"
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        rotation-per-second="3deg"
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="520.2deg 74.59deg 400m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg 400m" 
        min-camera-orbit="auto auto 20.4m" 
        min-field-of-view="3deg"
        interaction-prompt="none"> 
    </model-viewer>

    <script>
        const viewer = document.getElementById('gannett-viewer');
        const titleContainer = document.getElementById('title-container');
        const overlay = document.getElementById('loading-overlay');
        const spinner = document.getElementById('spinner');
        const customPrompt = document.getElementById('custom-prompt');

        // Animation sequence on load
        viewer.addEventListener('load', () => {
            // 1. Hide spinner
            spinner.classList.add('hidden');

            // 2. Wait 800ms, then trigger zoom, fade overlay, and slide text
            setTimeout(() => {
                overlay.classList.add('hidden'); 
                // Changed target camera-orbit to 200m to complete the zoom IN
                viewer.setAttribute('camera-orbit', '550.2deg 74.59deg 175m'); 
                titleContainer.classList.add('zoomed'); 

                // 3. Wait for zoom to finish (1.5s), then fade in the custom prompt
                setTimeout(() => {
                    customPrompt.classList.add('visible');
                }, 1500);

            }, 800);
        });

        // Hide custom prompt the moment the user interacts
        viewer.addEventListener('camera-change', (event) => {
            if (event.detail.source === 'user-interaction') {
                customPrompt.classList.remove('visible');
            }
        });
    </script>

</body>
</html>
