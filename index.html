<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gannett Building</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        
        /* 3D Viewer Base */
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
        }

        /* Loading Screen Elements */
        #loading-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #222;
            z-index: 5;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #loading-overlay.hidden {
            opacity: 0;
        }

        #spinner {
            position: absolute;
            top: calc(50% + 140px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #spinner.hidden {
            opacity: 0;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* --- Title & Logo Container (Stage 1: Center) --- */
        #title-container {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 100vw;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.6s ease-in-out; /* Speed of the fade out */
        }

        /* Fades out the center elements */
        #title-container.fade-out {
            opacity: 0;
        }

        /* --- Title & Logo Container (Stage 2: Top Bar Drop-in) --- */
        #title-container.top-bar {
            top: 0; 
            left: 0;
            transform: translateY(-20px); /* Starts slightly raised up */
            flex-direction: row; 
            justify-content: center; /* Keeps Title precisely in center */
            padding: 25px 5%; /* 5% padding keeps items off the screen edges on mobile */
            box-sizing: border-box;
            opacity: 0; /* Hidden until drop-in */
            /* Smooth drop-in animation */
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1.2s ease-out; 
        }

        #title-container.top-bar.visible {
            opacity: 1;
            transform: translateY(0); /* Drops down into place */
        }

        /* Building Logo Base Styles */
        #building-logo {
            /* clamp() ensures it scales down for mobile but stays 120px max on desktop */
            height: clamp(80px, 15vw, 120px); 
            width: auto;
            mix-blend-mode: screen; 
            margin-bottom: 15px;
        }

        /* Building Title Base Styles */
        #building-title {
            margin: 0;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* clamp() prevents text from ever clipping on narrow phone screens */
            font-size: clamp(1.2rem, 5vw, 2.5rem); 
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
            white-space: nowrap; 
        }

        /* Adjust Logo specific to the Top Bar layout */
        #title-container.top-bar #building-logo {
            position: absolute;
            right: 5%; /* Anchors it to the top right */
            top: 25px; /* Matches container padding */
            height: clamp(40px, 8vw, 70px); /* Scales logo nicely for top bar */
            margin-bottom: 0;
        }

        /* Custom Interaction Prompt */
        #custom-prompt {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
            color: #ffffff;
            padding: 12px 32px; 
            border-radius: 50px; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem; 
            font-weight: 400;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            pointer-events: none;
            z-index: 10;
            opacity: 0; 
            transition: opacity 0.8s ease;
            animation: pulse 2.5s infinite;
        }

        #custom-prompt.visible {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); } 
            100% { transform: translateX(-50%) scale(1); }
        }
    </style> 
</head>  

<body>

    <div id="loading-overlay"></div>
    <div id="spinner"></div>

    <div id="title-container">
        <img id="building-logo" src="LogoF.png" alt="Gannett Logo">
        <h1 id="building-title">Gannett Building</h1>
    </div>

    <div id="custom-prompt">Drag to interact</div>
    
    <model-viewer 
        id="gannett-viewer"
        src="Gannett-Drive-4-10-2026-textured_model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls  
        rotation-per-second="3deg"
        tone-mapping="neutral" 
        poster="poster.webp" 
        shadow-intensity="1" 
        camera-orbit="520.2deg 74.59deg 675m" 
        field-of-view="12deg" 
        orientation="0 -90deg 0" 
        max-camera-orbit="auto 90deg 700m" 
        min-camera-orbit="auto auto 100.4m" 
        min-field-of-view="4deg"
        interpolation-decay="575"
        interaction-prompt="none"> 
    </model-viewer>

    <script>
        const viewer = document.getElementById('gannett-viewer');
        const titleContainer = document.getElementById('title-container');
        const overlay = document.getElementById('loading-overlay');
        const spinner = document.getElementById('spinner');
        const customPrompt = document.getElementById('custom-prompt');

        // Animation sequence on load
        viewer.addEventListener('load', () => {
            // 1. Hide spinner immediately
            spinner.classList.add('hidden');

            // 2. Wait 800ms, then trigger black overlay fade AND center text fade out
            setTimeout(() => {
                overlay.classList.add('hidden'); 
                titleContainer.classList.add('fade-out'); // Stage 1: Fade out from center

                // 3. Wait for the center fade out to finish (600ms), then prep the top bar
                setTimeout(() => {
                    titleContainer.classList.remove('fade-out'); // Reset class
                    titleContainer.classList.add('top-bar'); // Changes layout to top-bar

                    // Tiny delay to let the browser register the new layout, then drop in!
                    setTimeout(() => {
                        titleContainer.classList.add('visible'); // Stage 2: Drops in from top
                    }, 50);

                }, 600);

                // Delay the camera zoom slightly so the black overlay has time to start fading
                setTimeout(() => {
                    viewer.setAttribute('camera-orbit', '582.2deg 74.59deg 255m'); 
                }, 400);

                // 4. Wait for the camera to mostly settle, then fade in the custom prompt
                setTimeout(() => {
                    customPrompt.classList.add('visible');
                    
                    // This turns on the auto-rotation!
                    viewer.autoRotate = true; 
                    
                }, 3200); 

            }, 800);
        });

        // Hide custom prompt the moment the user interacts AND fix interaction speed
        viewer.addEventListener('camera-change', (event) => {
            if (event.detail.source === 'user-interaction') {
                
                // Hide the prompt
                customPrompt.classList.remove('visible');
                
                // Switch to fast, responsive dragging instantly
                viewer.setAttribute('interpolation-decay', '100');
            }
        });
    </script>

</body>
</html>
